name: CI

on:
  push:
    branches: [ main, "arena/**" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j2
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Headless smoke test
        run: |
          build/bin/techdemo --frames 10 --screenshot /tmp/smoke.ppm
          test -s /tmp/smoke.ppm
